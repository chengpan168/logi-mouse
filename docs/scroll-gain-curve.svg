<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">Options+ observed gain and fitted scroll dynamics curve</title>
  <desc id="description">Observed median gain and interquartile range from five recordings, overlaid with the fitted logistic curve using minimum gain 0.85, maximum gain 5.75, midpoint 5.3, steepness 6, and decay time constant 80 milliseconds.</desc>
  <rect x="1" y="1" width="958" height="558" rx="12" fill="#ffffff" stroke="#d1d5db"/>

  <text x="64" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600" fill="#111827">Options+ 滚动增益：观测数据与 Logistic 拟合</text>
  <text x="64" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#4b5563">五组录制按活动量 0.5 分箱；圆点为观测中位数，竖线为四分位区间（每箱至少 5 个事件）</text>

  <!-- Plot grid and axes, expressed in data coordinates: x 0...15.5, y 0...6.2. -->
  <g transform="translate(85 480) scale(52.580645 -64.516129)">
    <g fill="none" stroke="#e5e7eb" stroke-width="1">
      <path d="M 0 0 H 15.5 M 0 1 H 15.5 M 0 2 H 15.5 M 0 3 H 15.5 M 0 4 H 15.5 M 0 5 H 15.5 M 0 6 H 15.5" vector-effect="non-scaling-stroke"/>
      <path d="M 0 0 V 6.2 M 2.5 0 V 6.2 M 5 0 V 6.2 M 7.5 0 V 6.2 M 10 0 V 6.2 M 12.5 0 V 6.2 M 15 0 V 6.2" vector-effect="non-scaling-stroke"/>
    </g>

    <!-- Observed interquartile ranges. -->
    <g fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" opacity="0.75">
      <path d="M .25 .5 V 1 M .75 .5 V 1 M 2.25 .667 V 1 M 2.75 1 V 1.5 M 3.75 .667 V 1 M 4.25 .667 V 1 M 4.75 1 V 3.182 M 5.25 1 V 5.333 M 5.75 1 V 5 M 6.25 3 V 5.5 M 6.75 1 V 5.667 M 7.25 1 V 5.667 M 7.75 1 V 5.5 M 8.25 2.5 V 5.667 M 8.75 3 V 6 M 9.25 5.5 V 6 M 9.75 5.833 V 6 M 10.25 5.5 V 5.667 M 10.75 5.667 V 6 M 11.25 5.5 V 5.773 M 11.75 5.5 V 5.818 M 12.75 5.5 V 5.667 M 13.25 5.5 V 6 M 13.75 5.667 V 6 M 14.25 5.5 V 6 M 14.75 5.5 V 6 M 15.25 5.667 V 6" vector-effect="non-scaling-stroke"/>
    </g>

    <!-- Fitted Logistic curve from ScrollDynamicsParameters.optionsCaptureInitial. -->
    <path d="M 0.00 0.862 L 0.25 0.866 L 0.50 0.871 L 0.75 0.878 L 1.00 0.887 L 1.25 0.899 L 1.50 0.915 L 1.75 0.937 L 2.00 0.964 L 2.25 1.000 L 2.50 1.048 L 2.75 1.109 L 3.00 1.188 L 3.25 1.288 L 3.50 1.415 L 3.75 1.573 L 4.00 1.765 L 4.25 1.994 L 4.50 2.261 L 4.75 2.561 L 5.00 2.888 L 5.25 3.231 L 5.50 3.576 L 5.75 3.911 L 6.00 4.223 L 6.25 4.504 L 6.50 4.748 L 6.75 4.955 L 7.00 5.126 L 7.25 5.265 L 7.50 5.375 L 7.75 5.462 L 8.00 5.530 L 8.25 5.582 L 8.50 5.623 L 8.75 5.653 L 9.00 5.677 L 9.25 5.695 L 9.50 5.708 L 9.75 5.718 L 10.00 5.726 L 10.25 5.732 L 10.50 5.736 L 10.75 5.740 L 11.00 5.742 L 11.25 5.744 L 11.50 5.746 L 11.75 5.747 L 12.00 5.748 L 12.25 5.748 L 12.50 5.749 L 12.75 5.749 L 13.00 5.749 L 13.25 5.749 L 13.50 5.750 L 13.75 5.750 L 14.00 5.750 L 14.25 5.750 L 14.50 5.750 L 14.75 5.750 L 15.00 5.750 L 15.25 5.750 L 15.50 5.750" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>

    <!-- Observed bin medians. -->
    <g fill="#f97316" stroke="none">
      <circle cx=".25" cy=".75" r=".065"/><circle cx=".75" cy="1" r=".065"/><circle cx="1.25" cy="1" r=".065"/><circle cx="1.75" cy="1" r=".065"/>
      <circle cx="2.25" cy="1" r=".065"/><circle cx="2.75" cy="1" r=".065"/><circle cx="3.25" cy="1" r=".065"/><circle cx="3.75" cy="1" r=".065"/>
      <circle cx="4.25" cy="1" r=".065"/><circle cx="4.75" cy="1.5" r=".065"/><circle cx="5.25" cy="3" r=".065"/><circle cx="5.75" cy="2" r=".065"/>
      <circle cx="6.25" cy="4.5" r=".065"/><circle cx="6.75" cy="5.5" r=".065"/><circle cx="7.25" cy="5.5" r=".065"/><circle cx="7.75" cy="3.5" r=".065"/>
      <circle cx="8.25" cy="4" r=".065"/><circle cx="8.75" cy="5.5" r=".065"/><circle cx="9.25" cy="5.5" r=".065"/><circle cx="9.75" cy="6" r=".065"/>
      <circle cx="10.25" cy="5.667" r=".065"/><circle cx="10.75" cy="5.667" r=".065"/><circle cx="11.25" cy="5.5" r=".065"/><circle cx="11.75" cy="5.667" r=".065"/>
      <circle cx="12.25" cy="6" r=".065"/><circle cx="12.75" cy="5.5" r=".065"/><circle cx="13.25" cy="5.8" r=".065"/><circle cx="13.75" cy="6" r=".065"/>
      <circle cx="14.25" cy="5.714" r=".065"/><circle cx="14.75" cy="5.667" r=".065"/><circle cx="15.25" cy="6" r=".065"/>
    </g>

    <g fill="none" stroke="#374151" stroke-width="1.5">
      <path d="M 0 0 H 15.5 M 0 0 V 6.2" vector-effect="non-scaling-stroke"/>
    </g>
  </g>

  <!-- Axis labels and ticks. -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#4b5563">
    <text x="85" y="502" text-anchor="middle">0</text><text x="216.5" y="502" text-anchor="middle">2.5</text><text x="347.9" y="502" text-anchor="middle">5</text>
    <text x="479.4" y="502" text-anchor="middle">7.5</text><text x="610.8" y="502" text-anchor="middle">10</text><text x="742.3" y="502" text-anchor="middle">12.5</text><text x="873.7" y="502" text-anchor="middle">15</text>
    <text x="70" y="484" text-anchor="end">0</text><text x="70" y="419.5" text-anchor="end">1</text><text x="70" y="355" text-anchor="end">2</text>
    <text x="70" y="290.5" text-anchor="end">3</text><text x="70" y="225.9" text-anchor="end">4</text><text x="70" y="161.4" text-anchor="end">5</text><text x="70" y="96.9" text-anchor="end">6</text>
    <text x="492" y="535" text-anchor="middle" font-size="14" fill="#111827">衰减后的近期活动量 A</text>
    <text x="20" y="280" text-anchor="middle" font-size="14" fill="#111827" transform="rotate(-90 20 280)">输出增益（px / 滚轮单位）</text>
  </g>

  <!-- Legend. -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#374151">
    <line x1="590" y1="101" x2="622" y2="101" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="632" y="106">拟合曲线</text>
    <line x1="720" y1="101" x2="720" y2="119" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="720" cy="110" r="5" fill="#f97316" stroke="#ffffff" stroke-width="1.5"/>
    <text x="734" y="115">观测中位数 / 四分位区间</text>
  </g>

  <!-- Key fitted points. -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
    <path d="M 94 424 L 142 399" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text x="148" y="394" fill="#111827">低速平台 gₘᵢₙ = 0.85</text>
    <circle cx="363.7" cy="267.1" r="4" fill="#2563eb"/>
    <path d="M 367 264 L 405 233" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text x="411" y="228" fill="#111827">中点 A₀ = 5.3，gain = 3.30</text>
    <path d="M 802 109 L 830 132" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text x="834" y="137" fill="#111827">高速平台 gₘₐₓ = 5.75</text>
    <text x="590" y="139" fill="#4b5563">τ = 80 ms · steepness = 6.0</text>
  </g>
</svg>
